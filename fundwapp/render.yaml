# Render Blueprint: Render dashboard > New > Blueprint > pick this repo.
# Values marked "sync: false" are asked for in the dashboard the first time (they are secrets or depend on your accounts).
services:
  - type: web
    name: fundwapp
    runtime: node
    plan: starter            # use "free" only for a demo: it sleeps, loses cron jobs and can miss M-Pesa callbacks
    region: frankfurt
    branch: main
    buildCommand: npm install
    # Applies migrations, loads reference data (insert-missing only, so admin edits survive), creates the first admin
    # from ADMIN_* if it does not exist yet, then starts the server.
    startCommand: npm run db:setup && node scripts/create-admin.js --if-missing && npm start
    healthCheckPath: /api/health
    numInstances: 1          # keep at 1: cron jobs and the live-totals bus run inside the process
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "true" }
      - { key: APP_TIMEZONE, value: Africa/Nairobi }
      - { key: CURRENCY_CODE, value: KES }
      - { key: CURRENCY_MINOR_UNITS, value: "2" }
      - { key: LOCALE, value: en-KE }
      - { key: DEFAULT_COUNTRY_CALLING_CODE, value: "254" }
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: PAYMENT_CALLBACK_SECRET, generateValue: true }
      - { key: PAYMENT_MODE, value: live }
      - { key: MPESA_ENV, value: sandbox }          # change to production after Safaricom go-live
      - { key: DATABASE_URL, sync: false }
      - { key: DATABASE_AUTH_TOKEN, sync: false }
      - { key: MPESA_CONSUMER_KEY, sync: false }
      - { key: MPESA_CONSUMER_SECRET, sync: false }
      - { key: MPESA_SHORTCODE, sync: false }
      - { key: MPESA_PASSKEY, sync: false }
      - { key: MPESA_TRANSACTION_TYPE, value: CustomerPayBillOnline }
      - { key: SMS_PROVIDER, value: africastalking }
      - { key: AT_BASE_URL, value: "https://api.africastalking.com" }
      - { key: AT_USERNAME, sync: false }
      - { key: AT_API_KEY, sync: false }
      - { key: AT_SENDER_ID, sync: false }
      - { key: ADMIN_FULL_NAME, sync: false }
      - { key: ADMIN_PHONE, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
